# Wariant domykajacy sie — WARTOSCI PRZYKLADOWE, nie dane rzeczywistego projektu.
# Rozni sie od `wzorcowy.yaml` czterema pozycjami: nizszym udzialem kredytu,
# brakiem karencji oraz ujeciem nakladu inwestycyjnego w kosztach UOIG.
# Pokazuje, ze przy tych samych kosztach i tym samym udziale puli komunalnej
# o werdykcie decyduje struktura finansowania, a nie sama skala projektu.
# Przed uzyciem do wniosku podmien komplet parametrow zewnetrznych na aktualne.

projekt:
  nazwa: "Wariant domykajacy sie — hybryda 30% komunalna, naklad w roku pierwszym"
  gmina: "Przykladowo"
  wojewodztwo: "wielkopolskie"

powierzchnie:
  pum_laczne: 3000.0            # m2
  liczba_lokali: 55             # srednie PUM lokalu 54,5 m2 — w przedziale 25-80
  liczba_kondygnacji: 4         # >= 3, wiec dzwigi obowiazkowe
  udzial_puli_komunalnej: 0.30  # GLOWNE POKRETLO

koszty:
  koszt_budowy_na_m2: 7500.0
  infrastruktura: 1200000.0
  projekt_i_nadzor: 900000.0
  koszty_ogolne: 600000.0
  rezerwa: 700000.0
  dzwigi: 350000.0
  vat_odliczalny: true          # art. 13 ust. 3 — decyduje o VAT w podstawie grantu
  stawka_vat: 0.08              # stosowana tylko gdy vat_odliczalny = false

grunt:
  wartosc: 2800000.0            # z operatu szacunkowego
  # Poziom 1 — czyja jest dzialka: inwestor | rynek_prywatny | gmina
  pochodzenie: gmina
  # Poziom 2 — w jakiej formie trafia do projektu. Zestaw zalezy od pochodzenia:
  #   inwestor       -> aport_inwestora | spolka_wlascicielem
  #   rynek_prywatny -> nabycie_prywatne
  #   gmina          -> nabycie_od_gminy | lokal_za_grunt
  #                     | uzytkowanie_wieczyste | dzierzawa
  forma: nabycie_od_gminy
  obciazony_hipoteka: false
  # Wielkosci negocjowane z gmina. Uzywane tylko przez forme, ktora ich dotyczy;
  # przy pozostalych formach czekaja i sluza widokowi porownawczemu.
  # Dzierzawa i uzytkowanie wieczyste — koszt biezacy przez caly okres:
  oplata_roczna: 140000.0
  # Lokal za grunt — liczbe i powierzchnie okresla uchwala rady gminy
  # (ustawa z 16.12.2020, Dz.U. 2021 poz. 223), wiec sa przedmiotem negocjacji:
  liczba_lokali_dla_gminy: 6
  pum_lokali_dla_gminy: 300.0
  # Cena po bonifikacie — potrzebna tylko przy odczycie alternatywnym kwestii 9.3:
  # cena_nabycia: 0.0

pula_spoleczna:
  kredyt:
    oprocentowanie: 0.025       # rp — preferencyjna stopa kredytu SBC
    okres_lat: 30               # N, max 30 wliczajac karencje (art. 15b ust. 3)
    karencja_lat: 0             # T — brak karencji, brak skoku raty w roku 4
    udzial_docelowy: 0.25       # nizsza dzwignia — rata miesci sie w limicie czynszu
  partycypacja:
    stawka_procent_kosztu_lokalu: 0.20   # max 0,30 (art. 29a ust. 2)
    rotacja_roczna: 0.07                 # do rezerwy na zwrot partycypacji
  czynsz_zakladany_m2_mies: 22.00   # ponizej limitu wiazacego, patrz zakladka Werdykty
  bonus_rewitalizacyjny: false           # przy aktywnym kredycie musi byc false (art. 13 ust. 4)

pula_komunalna:
  czynsz_placony_przez_gmine_m2_mies: 14.00
  bonus_rewitalizacyjny: false
  # kredyt i partycypacja sa tu niedopuszczalne — art. 5a ust. 3 ustawy z 8.12.2006

# Sufit faktyczny — poziom akceptowany przez rynek najmu w tej miejscowosci.
# Silnik go NIE WYLICZA i nie zgaduje: bez tej danej narzedzie zadaje pytanie
# zamiast podawac liczbe. Pole opcjonalne; gdy wypelnione, 'zrodlo' jest wymagane.
# Najprosciej: przejrzyj kilkanascie aktualnych ofert mieszkan o podobnym metrazu
# i wez mediane. Dotyczy wylacznie puli spolecznej — w komunalnej najemca jest gmina.
rynek:
  czynsz_rynkowy_m2_mies:   # np. 34.00 — zostaw puste, jesli nie znasz stawki
  zrodlo:                   # np. "mediana z 15 ofert 40-55 m2, portal ogloszeniowy"
  data:                     # np. 2026-08-10

eksploatacja:
  koszt_eksploatacji_m2_rok: 30.00
  odpis_remontowy_m2_rok: 12.00
  ubezpieczenie_rocznie: 22000.0
  koszty_stale_zarzadu_rocznie: 90000.0
  pustostany_procent: 0.05
  indeksacja_kosztow_rocznie: 0.035
  indeksacja_czynszu_rocznie: 0.030

parametry_zewnetrzne:
  wartosc_odtworzeniowa_m2: 6500.0
  stopa_bazowa_ke: 0.0442               # rb
  stopa_referencyjna_ke: 0.0542         # r
  stopa_dyskontowa: 0.0542              # rd
  stopa_irs_bgk: 0.0480
  waloryzacja_partycypacji_rocznie: 0.040   # wskaznik ceny 1 m2 GUS, art. 29a ust. 3
  okres_amortyzacji_budynkow_lat: 100       # limituje okres powierzenia, § 11 rozp. 766
  # Bufor obslugi dlugu przy wymiarowaniu kredytu (pakiet nr 2, rozdz. 1).
  # Wpis jest opcjonalny; brak = 1.20. Prog testu 2 pozostaje 1,00 niezaleznie.
  minimalny_wskaznik_pokrycia_obslugi_dlugu: 1.20
  data_parametrow: 2026-08-01
  zrodla:
    wartosc_odtworzeniowa_m2: "WARTOSC PRZYKLADOWA — podmien na obwieszczenie wojewody, dz. urz. woj."
    stopa_bazowa_ke: "WARTOSC PRZYKLADOWA — podmien na komunikat KE o stopach bazowych"
    stopa_referencyjna_ke: "WARTOSC PRZYKLADOWA — podmien na komunikat KE o stopach referencyjnych"
    stopa_dyskontowa: "WARTOSC PRZYKLADOWA — podmien na komunikat KE o stopach dyskontowych"
    stopa_irs_bgk: "WARTOSC PRZYKLADOWA — podmien na ogloszenie BGK w BIP dla edycji naboru"
    waloryzacja_partycypacji_rocznie: "WARTOSC PRZYKLADOWA — podmien na wskaznik ceny 1 m2 GUS"
    okres_amortyzacji_budynkow_lat: "WARTOSC PRZYKLADOWA — przyjac okres amortyzacji z polityki rachunkowosci inwestora"
    minimalny_wskaznik_pokrycia_obslugi_dlugu: "ZALOZENIE — poziom typowy dla nieruchomosci przychodowych; ani rozp. o finansowaniu zwrotnym, ani informator BGK nie podaja wymaganego pokrycia. Do potwierdzenia w BGK."

rekompensata:
  wsparcie_rfrm: 0.0                    # § 7 ust. 7 rozp. 1897 — wlicza sie do rekompensaty
  wartosc_dokumentacji_bgk: 0.0         # nieodplatne prawo do dokumentacji projektowej BGK

inwestor:
  # Ustawione tak, zeby punkt graniczny wypadl wewnatrz zakresu sweepu i bylo
  # widac glowny wynik operacyjny narzedzia: kazdy metr przesuniety do puli
  # komunalnej traci dzwignie kredytowa i partycypacje, wiec musi go pokryc
  # grant albo kapital wlasny.
  dostepny_wklad_wlasny: 4600000.0

przelaczniki:
  # automatyczny — silnik liczy najwiekszy kredyt, ktory uniesie zakladany czynsz,
  #   przez co wskaznik pokrycia wychodzi rowny buforowi, a wynikiem jest wymagany
  #   wklad wlasny;
  # reczny — kwote wyznacza kredyt.udzial_docelowy, a pokrycie wraca do roli miary.
  tryb_kredytu: automatyczny
  # Kwestie otwarte rozdz. 10 — wartosci domyslne sa ZALOZENIAMI, nie rozstrzygnieciami.
  hybryda_jako_jedno_przedsiewziecie: false
  # Naklad inwestycyjny wchodzi do kosztow UOIG w roku poniesienia. Wybor ujecia
  # przesadza o wyniku testu 3 — patrz LUKI.md, pozycja 3.
  koszty_inwestycyjne_w_kn: naklad_poczatkowy
  # Kwestie 9.1-9.3 uzupelnienia nr 2 — grunt. Wartosci domyslne sa ZALOZENIAMI
  # do potwierdzenia w BGK, nie odczytem przepisu.
  lokal_za_grunt_jest_przychodem_uoig: false
  uzytkowanie_wieczyste_jest_przychodem_uoig: true
  pasmo_liczone_od_wartosci_z_operatu: true
  # Zbieg progow tolerancji nadwyzki (pakiet nr 2, rozdz. 2). Pula spoleczna ma
  # dotacje I kredyt naraz, a kazdy instrument ma wlasny prog: 10% i 20%. Zaden
  # przepis nie rozstrzyga zbiegu. ZALOZENIE — potrafi samo przewrocic werdykt.
  #   nizszy | wyzszy | wedlug_instrumentu_dominujacego
  prog_tolerancji_przy_dwoch_instrumentach: nizszy
  # Czy bonus +5 pp (art. 13 ust. 4) podnosi TAKZE prog gruntowy, czy tylko
  # limit gorny. Domyslnie tylko gorny. ZALOZENIE.
  bonus_podnosi_prog_gruntowy: false
  # Z ktorej puli pochodza lokale oddawane gminie w trybie "lokal za grunt".
  # Ustawa nie wskazuje. proporcjonalnie | komunalna | spoleczna. ZALOZENIE.
  lokale_dla_gminy_z_puli: proporcjonalnie
  # Dlugosc okresu rozliczeniowego nadwyzki rekompensaty. 1 = kontrola w kazdym
  # roku, wariant najostrozniejszy; dluzszy daje lagodniejszy wynik. ZALOZENIE.
  okres_rozliczeniowy_nadwyzki_lat: 1
  metoda_rozsadnego_zysku: kapital_zaangazowany
  remont_i_przebudowa: false
